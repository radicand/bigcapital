# This workflow will build a docker container, publish it to Github Registry.
name: Build and Deploy Develop Docker Container
on:
  push:
    branches:
      - radicand-develop

env:
  WEBAPP_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bigcapital-webapp
  SERVER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bigcapital-server
  MIGRATION_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bigcapital-migration

permissions:
  contents: read
  packages: write

jobs:
  build-publish-webapp:
    name: Build and deploy webapp container
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR.
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEBAPP_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=

      # Builds and push the Docker image.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./
          file: ./packages/webapp/Dockerfile
          platforms: linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-webapp
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-publish-server:
    name: Build and deploy server container
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR.
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=

      # Builds and push the Docker image.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./
          file: ./packages/server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-server
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-publish-migration:
    name: Build and deploy migration container
    runs-on: ubuntu-24.04-arm
    needs:
      - build-publish-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MIGRATION_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=

      - name: Extract metadata for server base image tag
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./
          file: ./docker/migration/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_SERVER_IMAGE=${{ env.SERVER_IMAGE_NAME }}:${{ steps.server_meta.outputs.version }}
